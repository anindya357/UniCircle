name: unicircle

# Local development PostgreSQL only. Frontend/backend services follow in 10.4.
# Use --env-file .env.compose so these credentials remain separate from production.
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unicircle_docker_dev}
      POSTGRES_USER: ${POSTGRES_USER:-unicircle_docker_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only password in .env.compose}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
